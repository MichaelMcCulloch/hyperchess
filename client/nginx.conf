server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API to the in-cluster gateway service so the gateway is
    # never exposed at the edge. take_turn runs a distributed search bounded by
    # HYPERCHESS_COMPUTE_MINUTES, so the request can be held open for a long
    # time — allow up to one hour before nginx gives up.
    location /api/v1/ {
        proxy_pass http://hyperchess-server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # SPA history fallback: serve index.html for client-side routes (e.g. a
    # refresh on /game/<uuid>) instead of 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
